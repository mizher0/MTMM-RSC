# config/config.yaml
# Dataset Configuration
dataset:
  data_dir: "/path/to/MultiSenGE"
  num_classes: 14
  patch_size: 256
  temporal_length: 12
  sar_channels: 2
  optical_channels: 10
  
  # Class names
  class_names:
    - "Dense Built-Up"
    - "Sparse Built-Up"
    - "Specialized Built-Up"
    - "Specialized Vegetative"
    - "Large Scale Networks"
    - "Arable Lands"
    - "Vineyards"
    - "Orchards"
    - "Grasslands"
    - "Groves/Hedges"
    - "Forests"
    - "Open Spaces/Mineral"
    - "Wetlands"
    - "Water Surfaces"

# Preprocessing Configuration
preprocessing:
  cloud_threshold: 0.10
  temporal_window_optical: 15
  temporal_window_sar: 10
  sigma_temporal: 7.0
  epsilon: 1.0e-6
  
  sar_normalization:
    vv_mean: -18.3
    vv_std: 4.7
    vh_mean: -24.1
    vh_std: 5.2
  
  optical_normalization:
    means: [0.09, 0.10, 0.11, 0.13, 0.15, 0.17, 0.28, 0.29, 0.21, 0.18]
    stds: [0.06, 0.05, 0.06, 0.07, 0.08, 0.09, 0.11, 0.12, 0.09, 0.08]

# Feature Engineering Configuration
features:
  correlation_threshold: 0.95
  glcm_distances: [1, 3]
  glcm_angles: [0, 45, 90, 135]

# Training Configuration
training:
  num_folds: 5
  batch_size: 32
  num_epochs: 100
  early_stopping_patience: 15
  
  optimizer: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  
  scheduler: "cosine"
  lr_min: 1.0e-6
  warmup_epochs: 10
  
  dropout_rate: 0.3
  dropout_intermediate: 0.1
  label_smoothing: 0.1
  
  augmentation_prob: 0.5
  noise_std: 0.05
  sar_scale_range: [0.9, 1.1]
  
  device: "cuda"
  num_workers: 8
  pin_memory: true

# Model Configurations
models:
  efficientnet_3d:
    stages: [2, 3, 3, 4, 4]
    channels: [32, 48, 96, 136, 232]
    expansion_ratio: 6
    se_ratio: 0.25
    
  cnn_bilstm:
    cnn_backbone: "resnet18"
    lstm_hidden_dim: 256
    num_lstm_layers: 2
    attention_heads: 8
    attention_dim: 64
    
  temporal_gcn:
    node_features: 36
    hidden_dims: [128, 64, 32]
    graph_alpha: 0.6
    graph_tau: 2.0
    graph_sigma: 0.5
    graph_window: 4
    
  vision_transformer:
    patch_size: 16
    embed_dim: 768
    depth: 12
    num_heads: 16
    mlp_ratio: 4
    
  random_forest:
    n_estimators: 500
    max_depth: 30
    min_samples_split: 10
    max_features: "sqrt"
    
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 8
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    reg_alpha: 0.1
    
  svm:
    kernel: "rbf"
    C: 10.0
    gamma: 0.001
    
  knn:
    n_neighbors: 7
    weights: "distance"
    metric: "minkowski"
    p: 2

# Ensemble Configuration
ensemble:
  optimization_method: "SLSQP"
  max_iterations: 1000
  temperature_range: [0.1, 5.0]
  temperature_steps: 50
